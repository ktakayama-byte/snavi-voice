<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声の環境チェック</title>
<style>
:root{--bg:#f4efe6;--surface:#fffdf8;--ink:#2b2622;--sub:#6e655c;--line:#e2d9cb;--accent:#e8792b;--ok:#3a9d5d;--ng:#d9534f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--surface:#22222a;--ink:#f1ebe0;--sub:#a9a196;--line:#34343f}}
:root[data-theme="dark"]{--bg:#17171c;--surface:#22222a;--ink:#f1ebe0;--sub:#a9a196;--line:#34343f}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
p.note{color:var(--sub);font-size:14px;margin:0 0 16px}
button{font:inherit;font-size:18px;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px 20px;width:100%;cursor:pointer}
button:disabled{opacity:.5}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.row b{min-width:92px}
.row .r{flex:1;overflow-wrap:anywhere}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}.wait{color:var(--sub)}
pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:14px;user-select:all}
</style>
</head>
<body>
<div class="wrap">
  <h1>声の環境チェック</h1>
  <p class="note">ボタンを押すと、このブラウザで「ヘイ、ミナ」に必要な4つが使えるか調べます。マイクの許可を聞かれたら「許可」。結果の枠を長押しコピーして Claude に貼ってください。</p>
  <button id="go">チェックを始める</button>
  <div class="row"><b>ブラウザ</b><div class="r" id="ua">…</div></div>
  <div class="row"><b>① マイク</b><div class="r wait" id="mic">未実行</div></div>
  <div class="row"><b>② 音声の部品</b><div class="r wait" id="wl">未実行</div></div>
  <div class="row"><b>③ ElevenLabs接続</b><div class="r wait" id="ws">未実行</div></div>
  <div class="row"><b>④ 待受（音声認識）</b><div class="r wait" id="sr">未実行</div></div>
  <div class="row"><b>⑤ 読み上げ</b><div class="r wait" id="tts">未実行</div></div>
  <pre id="out">（結果はここに出ます）</pre>
</div>
<script>
const $ = id => document.getElementById(id); const res = {};
function set(id, ok, text){ const e = $(id); e.className = 'r ' + (ok===true ? 'ok' : ok===false ? 'ng' : 'wait'); e.textContent = text; res[id] = (ok===true?'OK ':ok===false?'NG ':'') + text; $('out').textContent = JSON.stringify(res, null, 1); }
let cspHit = ''; document.addEventListener('securitypolicyviolation', ev => { cspHit += (ev.violatedDirective||'') + ' ' + (ev.blockedURI||'') + '; '; });
const isBrave = !!(navigator.brave && navigator.brave.isBrave); const ua = navigator.userAgent;
$('ua').textContent = (isBrave ? 'Brave ' : '') + ua.slice(0, 160) + ' | 住所: ' + location.protocol + '//' + location.host + ' | 安全な接続: ' + (window.isSecureContext ? 'はい' : 'いいえ');
res.ua = $('ua').textContent;
$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  // ① マイク
  try { const st = await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t => t.stop()); set('mic', true, 'マイクが使えます'); } catch(e){ set('mic', false, 'マイクが使えません: ' + (e.name||'') + ' ' + (e.message||'')); }
  // ② AudioWorklet（blob → data の順。ElevenLabs の部品と同じ読み方）
  try { const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC(); try { await ac.resume(); } catch(e){}
    const src = 'class X extends AudioWorkletProcessor{process(){return true}} registerProcessor("x",X);'; let how = '';
    try { await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([src],{type:'application/javascript'}))); how = 'blob'; } catch(e){ await ac.audioWorklet.addModule('data:application/javascript;base64,' + btoa(src)); how = 'data'; }
    set('wl', true, '音声の部品を読めます（' + how + '）'); } catch(e){ set('wl', false, '音声の部品を読めません: ' + (e.message||e)); }
  // ③ ElevenLabs への WebSocket（CSP で止まるなら SecurityError。サーバーに届けば 4xx で閉じる＝OK）
  await new Promise(done => { let ws; const t = setTimeout(() => { set('ws', null, '応答待ちのまま10秒（ネットが遅いか、止められている）'); done(); }, 10000);
    try { ws = new WebSocket('wss://api.elevenlabs.io/v1/convai/conversation?agent_id=check'); } catch(e){ clearTimeout(t); set('ws', false, '接続を作れません（この場所からは外に出られない）: ' + (e.message||e)); return done(); }
    ws.onopen = () => { clearTimeout(t); set('ws', true, 'ElevenLabs に届きました'); try { ws.close(); } catch(e){} done(); };
    ws.onerror = () => {}; ws.onclose = ev => { clearTimeout(t); setTimeout(() => { if (cspHit) set('ws', false, 'この場所の安全設定で外への接続が止められています: ' + cspHit); else if (ev.code === 1006) set('ws', null, '接続が閉じられました（コード 1006）。安全設定の違反は検出されていないので、届いた可能性が高い'); else set('ws', true, 'ElevenLabs に届きました（コード ' + ev.code + '。ID なしなので閉じられるのが正常）'); done(); }, 200); }; });
  // ④ 待受（SpeechRecognition）
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) set('sr', false, 'この ブラウザには音声認識がありません（待受は使えない。ボタンで話す方式は使える）');
  else await new Promise(done => { let got = false; const r = new R(); r.lang = 'ja-JP'; r.interimResults = true; const t = setTimeout(() => { try { r.stop(); } catch(e){} if (!got) set('sr', null, '音声認識は起動したが8秒で何も聞き取れなかった（何か話してみて再実行）'); done(); }, 8000);
    r.onresult = ev => { got = true; clearTimeout(t); set('sr', true, '聞き取れました: ' + ev.results[ev.results.length-1][0].transcript); try { r.stop(); } catch(e){} done(); };
    r.onerror = ev => { clearTimeout(t); set('sr', false, '音声認識エラー: ' + ev.error + (isBrave ? '（Brave は音声認識を止めている）' : '')); done(); };
    try { set('sr', null, '何か話してください（8秒）…'); r.start(); } catch(e){ clearTimeout(t); set('sr', false, '起動できません: ' + (e.message||e)); done(); } });
  // ⑤ 読み上げ（ブラウザ標準）
  try { if (!('speechSynthesis' in window)) throw new Error('なし'); const u = new SpeechSynthesisUtterance('テストです'); u.lang = 'ja-JP'; speechSynthesis.speak(u); set('tts', true, 'ブラウザの読み上げあり（日本語の声は ' + speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja')).length + ' 個）'); } catch(e){ set('tts', false, '読み上げなし'); }
  $('go').disabled = false;
});
</script>
</body>
</html>
